<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mur — collection de vinyles</title>
<style>
:root{
  --noir:#14100D;
  --caisse:#1F1813;
  --carton:#2B221B;
  --papier:#EFE7D9;
  --poussiere:#94897A;
  --or:#E8B93A;
  --sillon:#0B0908;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--noir);
  color:var(--papier);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 80% at 50% -10%, rgba(232,185,58,.07), transparent 60%);
}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:36px 24px 80px}

/* ---- en-tête ---- */
header{border-bottom:1px solid rgba(239,231,217,.14);padding-bottom:22px;margin-bottom:26px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--poussiere);margin:0 0 10px
}
h1{
  font-size:clamp(34px,6vw,60px);line-height:.95;margin:0;font-weight:400;
  letter-spacing:-.02em;
}
h1 em{font-style:italic;color:var(--or)}
.sous{margin:12px 0 0;color:var(--poussiere);font-size:15px;max-width:52ch;line-height:1.5}

/* ---- barre d'outils ---- */
.outils{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 18px}
.champ{position:relative;flex:1 1 240px;max-width:340px}
.champ input{
  width:100%;background:var(--caisse);border:1px solid rgba(239,231,217,.16);
  color:var(--papier);font-family:var(--serif);font-size:15px;
  padding:11px 14px 11px 36px;border-radius:2px;outline:none;
}
.champ input::placeholder{color:var(--poussiere)}
.champ input:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(232,185,58,.16)}
.champ svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}

.pige{
  background:var(--or);color:var(--sillon);border:none;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 20px;border-radius:2px;font-weight:600;
  transition:transform .12s ease, filter .12s ease;
}
.pige:hover{filter:brightness(1.1)}
.pige:active{transform:translateY(1px)}
.pige:focus-visible,.puce:focus-visible,.carte:focus-visible,select:focus-visible{
  outline:2px solid var(--or);outline-offset:3px
}
select{
  background:var(--caisse);color:var(--papier);border:1px solid rgba(239,231,217,.16);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:12px 10px;border-radius:2px;
  cursor:pointer;text-transform:uppercase;outline:none;
}

.puces{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.puce{
  background:transparent;border:1px solid rgba(239,231,217,.2);color:var(--poussiere);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 11px;border-radius:100px;cursor:pointer;transition:all .14s ease;
}
.puce:hover{border-color:rgba(239,231,217,.5);color:var(--papier)}
.puce[aria-pressed="true"]{background:var(--papier);border-color:var(--papier);color:var(--sillon)}
.compte{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--poussiere);
  text-transform:uppercase;margin:16px 0 20px}

/* ---- le mur ---- */
.mur{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.carte{
  background:none;border:none;padding:0;cursor:pointer;text-align:left;color:inherit;
  display:flex;flex-direction:column;gap:9px;
  animation:monte .5s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pochette{
  position:relative;aspect-ratio:1;background:var(--carton);border-radius:1px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 10px 22px rgba(0,0,0,.5);
  overflow:hidden;transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease;
}
.carte:hover .pochette{transform:translateY(-6px) rotate(-1.1deg);box-shadow:0 20px 34px rgba(0,0,0,.62)}
.pochette img{width:100%;height:100%;object-fit:cover;display:block}
.vide{
  display:flex;align-items:center;justify-content:center;height:100%;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--poussiere);
  text-transform:uppercase;text-align:center;padding:14px;line-height:1.7;
  border:1px dashed rgba(239,231,217,.22);
}
.adresse{
  position:absolute;left:0;bottom:0;background:rgba(11,9,8,.82);color:var(--papier);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 7px;
  backdrop-filter:blur(3px);
}
.legende .t{font-size:14px;line-height:1.3;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legende .a{font-size:12.5px;color:var(--poussiere);margin:3px 0 0;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* ---- fiche ---- */
.voile{
  position:fixed;inset:0;background:rgba(8,6,5,.9);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:50;
}
.voile.on{display:flex;animation:fondu .2s ease both}
@keyframes fondu{from{opacity:0}to{opacity:1}}
.fiche{
  background:var(--caisse);border:1px solid rgba(239,231,217,.14);border-radius:2px;
  max-width:900px;width:100%;max-height:90vh;overflow:auto;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
}
.scene{padding:26px;perspective:1400px;background:var(--sillon);display:flex;
  flex-direction:column;gap:14px;justify-content:center}
.flip{position:relative;aspect-ratio:1;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.3,.8,.3,1)}
.flip.dos{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--carton);
  box-shadow:0 18px 40px rgba(0,0,0,.6)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.b{transform:rotateY(180deg)}
.tourner{
  background:transparent;border:1px solid rgba(239,231,217,.28);color:var(--papier);
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px;border-radius:2px;cursor:pointer;transition:all .14s ease;
}
.tourner:hover:not(:disabled){background:var(--papier);color:var(--sillon)}
.tourner:disabled{opacity:.32;cursor:not-allowed}
.detail{padding:30px 30px 26px;display:flex;flex-direction:column;gap:16px}
.detail h2{font-size:26px;line-height:1.15;margin:0;font-weight:400;letter-spacing:-.01em}
.detail .interp{color:var(--poussiere);font-size:15px;line-height:1.5;margin:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 18px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;align-items:baseline}
dt{color:var(--poussiere);text-transform:uppercase;letter-spacing:.14em;font-size:10px}
dd{margin:0}
.lien{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--or);text-decoration:none;border-bottom:1px solid rgba(232,185,58,.4);
  padding-bottom:2px;align-self:flex-start;
}
.lien:hover{border-color:var(--or)}
.fermer{
  position:absolute;top:16px;right:18px;background:none;border:none;color:var(--papier);
  font-size:30px;line-height:1;cursor:pointer;opacity:.55;padding:6px;
}
.fermer:hover{opacity:1}
.rien{color:var(--poussiere);font-size:15px;padding:50px 0;text-align:center;line-height:1.6}

@media(max-width:720px){
  .fiche{grid-template-columns:1fr}
  .mur{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:13px}
  .wrap{padding:26px 16px 60px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Chalet · bacs 01 à 03</p>
    <h1>Le mur des <em>pochettes</em></h1>
    <p class="sous">Toute la collection en images, dans l'ordre où les disques sont rangés.
      Clique une pochette pour la retourner.</p>
  </header>

  <div class="outils">
    <div class="champ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Chercher un titre, un interprète…" aria-label="Chercher">
    </div>
    <select id="tri" aria-label="Trier">
      <option value="bac">Ordre des bacs</option>
      <option value="titre">Titre</option>
      <option value="artiste">Interprète</option>
      <option value="annee">Année</option>
    </select>
    <button class="pige" id="pige">Pige un disque</button>
  </div>

  <div class="puces" id="bacs"></div>
  <div class="puces" id="familles"></div>
  <p class="compte" id="compte"></p>

  <div class="mur" id="mur"></div>
  <p class="rien" id="rien" hidden>Aucun disque ne correspond.<br>Efface la recherche ou relâche un filtre.</p>
</div>

<div class="voile" id="voile" role="dialog" aria-modal="true" aria-labelledby="ft">
  <div class="fiche" style="position:relative">
    <button class="fermer" id="fermer" aria-label="Fermer">&times;</button>
    <div class="scene">
      <div class="flip" id="flip">
        <div class="face a" id="faceA"></div>
        <div class="face b" id="faceB"></div>
      </div>
      <button class="tourner" id="tourner">Retourner</button>
    </div>
    <div class="detail">
      <div>
        <h2 id="ft"></h2>
        <p class="interp" id="fa"></p>
      </div>
      <dl id="fd"></dl>
      <a class="lien" id="fl" target="_blank" rel="noopener">Voir sur Discogs ↗</a>
    </div>
  </div>
</div>

const mur=document.getElementById('mur'), compte=document.getElementById('compte'),
      rien=document.getElementById('rien'), q=document.getElementById('q'),
      tri=document.getElementById('tri');
let fBac=null, fFam=null;

function puces(el, vals, get, set){
  vals.forEach(v=>{
    const b=document.createElement('button');
    b.className='puce'; b.textContent=v; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ set(get()===v?null:v);
      [...el.children].forEach(c=>c.setAttribute('aria-pressed', String(c.textContent===get())));
      rendre(); };
    el.appendChild(b);
  });
}
puces(document.getElementById('bacs'), [...new Set(D.map(r=>r.b))].sort(),
      ()=>fBac, v=>fBac=v);
puces(document.getElementById('familles'), [...new Set(D.map(r=>r.f))].sort(),
      ()=>fFam, v=>fFam=v);

function filtrer(){
  const t=q.value.trim().toLowerCase();
  let s=D.filter(r=>
    (!fBac||r.b===fBac) && (!fFam||r.f===fFam) &&
    (!t || (r.t+' '+r.a+' '+r.f).toLowerCase().includes(t)));
  const k=tri.value;
  s=[...s].sort((a,b)=>
    k==='titre'?a.t.localeCompare(b.t,'fr'):
    k==='artiste'?a.a.localeCompare(b.a,'fr'):
    k==='annee'?(+b.y||0)-(+a.y||0):
    a.b.localeCompare(b.b)|| a.o-b.o);
  return s;
}

function rendre(){
  const s=filtrer();
  mur.innerHTML='';
  rien.hidden=s.length>0;
  compte.textContent=s.length+(s.length>1?' disques':' disque')+
    (s.length!==D.length?' sur '+D.length:'');
  s.forEach((r,i)=>{
    const c=document.createElement('button');
    c.className='carte'; c.style.animationDelay=Math.min(i*14,500)+'ms';
    const img = r.th
      ? '<img loading="lazy" src="'+r.th+'" alt="Pochette de '+esc(r.t)+'">'
      : '<div class="vide">Pochette<br>absente de Discogs</div>';
    c.innerHTML='<div class="pochette">'+img+
      '<span class="adresse">'+r.b+' · '+r.o+'</span></div>'+
      '<div class="legende"><p class="t">'+esc(r.t)+'</p><p class="a">'+esc(r.a)+'</p></div>';
    c.onclick=()=>ouvrir(r);
    mur.appendChild(c);
  });
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

const voile=document.getElementById('voile'), flip=document.getElementById('flip');
function ouvrir(r){
  flip.classList.remove('dos');
  document.getElementById('faceA').innerHTML = r.rc
    ? '<img src="'+r.rc+'" alt="Recto">' : '<div class="vide">Pochette absente</div>';
  document.getElementById('faceB').innerHTML = r.vs
    ? '<img src="'+r.vs+'" alt="Verso">' : '<div class="vide">Verso absent</div>';
  const t=document.getElementById('tourner');
  t.disabled=!r.vs; t.textContent=r.vs?'Retourner':'Pas de verso';
  document.getElementById('ft').textContent=r.t;
  document.getElementById('fa').textContent=r.a;
  const d=[['Rangement',r.b+' · position '+r.o],['Famille',r.f]];
  if(r.y) d.push(['Année',r.y]);
  if(r.r) d.push(['Réputation',r.r]);
  d.push(['Images Discogs',r.n]);
  document.getElementById('fd').innerHTML=d.map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(''+v)+'</dd>').join('');
  document.getElementById('fl').href='https://www.discogs.com/release/'+r.d;
  voile.classList.add('on');
  document.getElementById('fermer').focus();
}
document.getElementById('tourner').onclick=()=>flip.classList.toggle('dos');
document.getElementById('fermer').onclick=()=>voile.classList.remove('on');
voile.onclick=e=>{if(e.target===voile)voile.classList.remove('on')};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')voile.classList.remove('on');
  if(e.key===' '&&voile.classList.contains('on')){e.preventDefault();
    if(!document.getElementById('tourner').disabled)flip.classList.toggle('dos');}
});

/* la pige : on fouille dans le bac avant de s'arrêter */
document.getElementById('pige').onclick=()=>{
  const s=filtrer(); if(!s.length)return;
  const doux=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(doux){ouvrir(s[Math.floor(Math.random()*s.length)]);return;}
  let n=0; const tot=14;
  const tic=()=>{
    const r=s[Math.floor(Math.random()*s.length)];
    if(++n>=tot){ouvrir(r);return;}
    ouvrir(r); voile.classList.add('on');
    setTimeout(tic, 45+n*11);
  };
  tic();
};

q.oninput=rendre; tri.onchange=rendre;
rendre();
</script>
