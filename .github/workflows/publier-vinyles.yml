name: Publication incrémentale Vinyles
on:
  workflow_run:
    workflows: ['Enrichissement différé des vinyles']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['scripts/publier_vinyles.py', '.github/workflows/publier-vinyles.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: publication-vinyles
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchroniser et publier automatiquement
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentative in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publier_vinyles.py
            if git diff --quiet -- index.html; then
              echo "Catalogue déjà synchronisé"
              exit 0
            fi
            git add index.html
            git commit -m "Synchroniser automatiquement le catalogue Airtable"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Un nouveau lot est arrivé : recalcul depuis la dernière version"
          done
          echo "Publication reportée au prochain passage automatique"
          exit 1
