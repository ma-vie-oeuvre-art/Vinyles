name: Enrichissement différé des vinyles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrichir-vinyles.yml'
      - 'scripts/**'
      - 'inbox/**'
      - 'photos/**'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: enrichissement-vinyles
  cancel-in-progress: false
jobs:
  enrichir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la configuration
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/verifier_configuration.py
      - name: Importer automatiquement les lots de photos
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/importer_photos.py
      - name: Installer le moteur de lecture des pochettes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
          python -m py_compile scripts/lire_pochettes.py scripts/enrichir_vinyles.py
      - name: Extraire le texte des pochettes dans Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          OCR_BATCH_SIZE: '40'
        run: |
          test -n "$AIRTABLE_TOKEN" || { echo "Secret AIRTABLE_TOKEN manquant"; exit 1; }
          python scripts/lire_pochettes.py
      - name: Reconnaître les albums depuis les photos
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/reconnaitre_albums.py
      - name: Rechercher des candidats Discogs pour les fiches Dicté
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          BATCH_SIZE: '20'
        run: |
          test -n "$AIRTABLE_TOKEN" || { echo "Secret AIRTABLE_TOKEN manquant"; exit 1; }
          python scripts/enrichir_vinyles.py
      - name: Qualifier les recherches du bac B-08
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/qualifier_vinyles.py
      - name: Récupérer les pochettes confirmées de tous les bacs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          COVER_BATCH_SIZE: '100'
          DRY_RUN: '0'
        run: python scripts/recuperer_pochettes_confirmees.py


      - name: Compléter les champs et recalculer le catalogue
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DRY_RUN: '0'
        run: python scripts/completer_metadonnees.py
