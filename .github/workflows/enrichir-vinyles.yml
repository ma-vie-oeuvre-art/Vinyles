name: Chaîne automatique Vinyles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'worker/**'
      - 'scripts/**'
      - 'inbox/**'
      - 'photos/**'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: '1'
  OMP_THREAD_LIMIT: '1'
jobs:
  coordonner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer immédiatement les corrections du moteur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/coordonner_traitements.py
  importer:
    name: Capture et transfert
    needs: coordonner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: importation-photos-vinyles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Vérifier les mécanismes et protéger la publication
        run: |
          node --check worker/ingestion.mjs
          node --check worker/import-airtable.mjs
          python -m py_compile scripts/*.py
          python scripts/verifier_securite.py
          python scripts/test_importer_photos.py
      - name: Importer les nouvelles photos sans attendre l’enrichissement
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PHOTO_SOURCE_SHA="$(git rev-parse HEAD)" python scripts/importer_photos.py
      - name: Synchroniser les bacs et séparer les références non confirmées
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/synchroniser_bacs.py --migrate-references
  enrichir:
    name: Traitement automatique
    needs: importer
    concurrency:
      group: enrichissement-vinyles
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les règles de reconnaissance automatique
        run: |
          python scripts/test_importer_photos.py
          python scripts/test_reconnaissance_automatique.py
          python scripts/test_reprises_automatiques.py
          python scripts/test_synchroniser_bacs.py
      - name: Vérifier la configuration
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/verifier_configuration.py
      - name: Réutiliser les recherches et références Discogs récentes
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vinyles-search-cache
          key: discogs-cache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: discogs-cache-v2-${{ runner.os }}-
      - name: Installer le moteur de lecture des pochettes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-bul
          python -m pip install --disable-pip-version-check Pillow
          python -m py_compile scripts/lire_pochettes.py scripts/enrichir_vinyles.py
      - name: Extraire le texte des pochettes dans Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          OCR_BATCH_SIZE: '40'
          OCR_WORKERS: '2'
        run: |
          test -n "$AIRTABLE_TOKEN" || { echo "Secret AIRTABLE_TOKEN manquant"; exit 1; }
          python scripts/lire_pochettes.py
      - name: Reconnaître les albums depuis les photos
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/reconnaitre_albums.py
      - name: Sélectionner automatiquement les pochettes encore incertaines
        id: neural
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/lire_pochettes_neural.py --select
      - name: Réutiliser les modèles du second lecteur
        if: steps.neural.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.EasyOCR/model
          key: neural-ocr-v1-${{ runner.os }}-python312
      - name: Installer le second lecteur uniquement si nécessaire
        if: steps.neural.outputs.count != '0'
        run: |
          python -m pip install --disable-pip-version-check torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check easyocr==1.7.2
      - name: Relire automatiquement les pochettes incertaines
        if: steps.neural.outputs.count != '0'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/lire_pochettes_neural.py
      - name: Reprendre la reconnaissance avec les nouveaux indices
        if: steps.neural.outputs.count != '0'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/reconnaitre_albums.py
      - name: Préparer la comparaison des pochettes encore incertaines
        id: visuel
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/comparer_pochettes.py --select
      - name: Installer la comparaison géométrique uniquement si nécessaire
        if: steps.visuel.outputs.count != '0'
        run: python -m pip install --disable-pip-version-check opencv-python-headless==5.0.0.93
      - name: Identifier automatiquement les albums par les images des pochettes
        if: steps.visuel.outputs.count != '0'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/comparer_pochettes.py
      - name: Rechercher des candidats Discogs pour les fiches Dicté
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          BATCH_SIZE: '20'
        run: |
          test -n "$AIRTABLE_TOKEN" || { echo "Secret AIRTABLE_TOKEN manquant"; exit 1; }
          python scripts/enrichir_vinyles.py
      - name: Qualifier les recherches de tous les bacs photographiés
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/qualifier_vinyles.py
      - name: Récupérer les pochettes confirmées de tous les bacs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          COVER_BATCH_SIZE: '100'
          DRY_RUN: '0'
        run: python scripts/recuperer_pochettes_confirmees.py


      - name: Compléter les champs et recalculer le catalogue
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DRY_RUN: '0'
        run: python scripts/completer_metadonnees.py

  controle:
    name: Contrôle des résultats
    needs: [importer, enrichir]
    if: ${{ always() && needs.importer.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Vérifier les captures et les enrichissements réels
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/verifier_resultat_automatique.py
  publication:
    name: Publication
    needs: controle
    if: ${{ !cancelled() && needs.controle.result == 'success' }}
    concurrency:
      group: publication-vinyles
      cancel-in-progress: false
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchroniser et publier automatiquement
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentative in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publier_vinyles.py
            if git diff --quiet -- index.html; then
              echo "Catalogue déjà synchronisé"
              exit 0
            fi
            git add index.html
            git commit -m "Synchroniser automatiquement le catalogue Airtable"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Un nouveau lot est arrivé : recalcul depuis la dernière version"
          done
          echo "Publication reportée au prochain passage automatique"
          exit 1
