name: Chaîne automatique Vinyles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'worker/**'
      - 'scripts/**'
      - 'inbox/**'
      - 'photos/**'
  workflow_dispatch:
    inputs:
      recalculer_familles:
        description: 'Recalculer familles, label et année des bacs B-08 et suivants'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: '1'
  OMP_THREAD_LIMIT: '1'
jobs:
  coordonner:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Appliquer immédiatement les corrections du moteur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/inspecter_etape.py scripts/coordonner_traitements.py
  importer:
    name: Capture et transfert
    needs: coordonner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: gestion-bacs-vinyles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Vérifier les mécanismes et protéger la publication
        run: |
          node --check worker/ingestion.mjs
          node --check worker/import-airtable.mjs
          python -m py_compile scripts/*.py
          python scripts/inspecter_etape.py scripts/verifier_securite.py
          python scripts/inspecter_etape.py scripts/test_importer_photos.py
      - name: Importer les nouvelles photos sans attendre l’enrichissement
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PHOTO_SOURCE_SHA="$(git rev-parse HEAD)" python scripts/inspecter_etape.py scripts/importer_photos.py
      - name: Synchroniser les bacs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/inspecter_etape.py scripts/synchroniser_bacs.py
  enrichir:
    name: Enrichissement Discogs
    needs: importer
    concurrency:
      group: enrichissement-vinyles
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier les règles de reconnaissance automatique
        run: |
          python scripts/inspecter_etape.py scripts/test_importer_photos.py
          python scripts/inspecter_etape.py scripts/test_synchroniser_bacs.py
      - name: Vérifier la configuration
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/inspecter_etape.py scripts/verifier_configuration.py
      - name: Réutiliser les recherches et références Discogs récentes
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vinyles-search-cache
            ${{ runner.temp }}/vinyles-cover-cache
          key: discogs-cache-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: discogs-cache-v3-${{ runner.os }}-
      - name: Enrichir depuis Discogs (release_id posés en session)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          METADATA_BATCH_SIZE: '100'
          DRY_RUN: '0'
        run: python scripts/inspecter_etape.py scripts/completer_metadonnees.py
      - name: Recalculer les familles (sur demande)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recalculer_familles }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python scripts/inspecter_etape.py scripts/recalculer_familles.py
      - name: Récupérer les pochettes confirmées de tous les bacs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          COVER_BATCH_SIZE: '100'
          DRY_RUN: '0'
        run: python scripts/inspecter_etape.py scripts/recuperer_pochettes_confirmees.py


      - name: Compléter les champs et recalculer le catalogue
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DRY_RUN: '0'
        run: python scripts/inspecter_etape.py scripts/completer_metadonnees.py

      - name: Lier les disques à leur chaîne sonore (table Prises de son)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: '0'
        run: python scripts/inspecter_etape.py scripts/lier_prises_de_son.py

  controle:
    name: Contrôle des résultats
    concurrency:
      group: gestion-bacs-vinyles
      cancel-in-progress: false
    needs: [importer, enrichir]
    if: ${{ always() && needs.importer.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Vérifier les captures et les enrichissements réels
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/inspecter_etape.py scripts/verifier_resultat_automatique.py
  valeurs:
    name: Rafraîchissement des valeurs
    # Rotation hebdomadaire + file quotidienne des disques en mouvement; historique daté versionné.
    needs: controle
    if: ${{ !cancelled() && needs.controle.result == 'success' }}
    concurrency:
      group: valeurs-vinyles
      cancel-in-progress: false
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Relever les chiffres de marché
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          VALEURS_LOT: '15'
          VALEURS_LOT_PRIORITAIRE: '10'
          DRY_RUN: '0'
        run: python scripts/inspecter_etape.py scripts/rafraichir_valeurs.py
      - name: Versionner l'historique des relevés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique/ state/rotation_valeurs.json
          if git diff --cached --quiet; then echo "Aucun relevé"; exit 0; fi
          git commit -m "Relevés de marché Discogs"
          for tentative in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
  publication:
    name: Publication
    needs: [controle, valeurs]
    if: ${{ !cancelled() && needs.controle.result == 'success' }}
    concurrency:
      group: publication-vinyles
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Synchroniser et publier automatiquement
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentative in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/inspecter_etape.py scripts/publier_vinyles.py
            git add index.html covers/
            if git diff --cached --quiet; then
              echo "Catalogue déjà synchronisé"
              exit 0
            fi
            git commit -m "Synchroniser automatiquement le catalogue Airtable"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Un nouveau lot est arrivé : recalcul depuis la dernière version"
          done
          echo "Publication reportée au prochain passage automatique"
          exit 1
