<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capture rapide — Vinyles</title><style>body{font:17px system-ui;max-width:640px;margin:25px auto;padding:0 16px;background:#171410;color:#f5eddf}input,button{font:inherit;padding:12px;margin:8px 0;border-radius:7px;box-sizing:border-box}input[type=text],input[type=number]{width:100%}button{background:#e8b93a;border:0;color:#171410}article{border:1px solid #666;padding:12px;margin:12px 0}small{color:#ccc}img{max-width:130px;max-height:130px;margin:4px}</style></head>
<body><h1>Capture rapide des bacs</h1><p>Numérote les photos dans l'ordre du bac. Aucun traitement Discogs pendant la capture.</p>
<label>Bac <input id="bac" value="B-08" type="text" pattern="B-[0-9]+"></label>
<label>Nombre de pochettes comptées <input id="nombre" type="number" min="1" required></label>
<p><strong>Attention :</strong> cet outil crée une archive locale, mais n'envoie encore rien à Airtable. Garde l'archive.</p>
<label>Photographier ou sélectionner des pochettes dans l'ordre <input id="photos" type="file" accept="image/*" multiple></label>
<div id="liste"></div><button id="exporter" type="button">Exporter le lot (photos + manifeste)</button><p id="message"></p>
<script>
const photos=document.getElementById('photos'),liste=document.getElementById('liste'),message=document.getElementById('message');let fichiers=[];
photos.addEventListener('change',()=>{fichiers.push(...Array.from(photos.files));photos.value='';afficher()});
function afficher(){liste.textContent='';fichiers.forEach((file,i)=>{let a=document.createElement('article'),img=document.createElement('img'),t=document.createElement('span'),b=document.createElement('button');img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);t.textContent='Rang '+(i+1)+' — '+file.name+' ';b.textContent='Retirer';b.onclick=()=>{fichiers.splice(i,1);afficher()};a.append(t,img,b);liste.append(a)})}
function u16(n){return [n&255,(n>>8)&255]}function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]}
const encoder=new TextEncoder();let crcTable=Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});
function crc(bytes){let x=0xffffffff;for(let b of bytes)x=crcTable[(x^b)&255]^(x>>>8);return (x^0xffffffff)>>>0}
function zip(entries){let chunks=[],central=[],pos=0;for(const e of entries){const name=encoder.encode(e.name),bytes=e.data,check=crc(bytes),size=bytes.length;const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(check),...u32(size),...u32(size),...u16(name.length),...u16(0),...name]);chunks.push(local,bytes);const cent=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(check),...u32(size),...u32(size),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(pos),...name]);central.push(cent);pos+=local.length+size}let len=central.reduce((a,b)=>a+b.length,0);return new Blob([...chunks,...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(len),...u32(pos),...u16(0)])],{type:'application/zip'})}
document.getElementById('exporter').onclick=async()=>{const bac=document.getElementById('bac').value.trim().toUpperCase(),nombre=Number(document.getElementById('nombre').value);if(!/^B-\d+$/.test(bac)||!Number.isInteger(nombre)||nombre<1||!fichiers.length){message.textContent='Renseigner le bac, le comptage et les photos.';return}message.textContent='Préparation de l’archive…';const entries=[],items=[];for(let i=0;i<fichiers.length;i++){const f=fichiers[i],extension=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').slice(0,8),name=bac+'-'+String(i+1).padStart(3,'0')+'.'+extension;entries.push({name:'photos/'+name,data:new Uint8Array(await f.arrayBuffer())});items.push({bac,rang:i+1,photo:'photos/'+name,statut:'Capture brute'})}const manifeste={bac,pochettes_comptees:nombre,date_capture:new Date().toISOString(),photos:items,attention:'Photos brutes — aucune identification Discogs validée'};entries.unshift({name:'manifest.json',data:encoder.encode(JSON.stringify(manifeste,null,2))});const blob=zip(entries),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=bac+'-capture.zip';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);message.textContent='Archive créée : '+fichiers.length+' photo(s). Conserve-la.'};
</script></body></html>
